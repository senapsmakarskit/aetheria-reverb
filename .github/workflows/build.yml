name: Build AETHERIA VST3 & Standalone

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up MSVC & CMake
      uses: cmake-tools-ninja/setup-ninja@v1

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build --config Release --parallel

    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Aetheria-Windows-VST3-and-EXE
        path: |
          build/AETHERIA_artefacts/Release/VST3/
          build/AETHERIA_artefacts/Release/Standalone/

  build-macos:
    name: Build on macOS
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build --config Release --parallel

    - name: Upload macOS Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Aetheria-macOS-VST3-and-APP
        path: |
          build/AETHERIA_artefacts/Release/VST3/
          build/AETHERIA_artefacts/Release/Standalone/
